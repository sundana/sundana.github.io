---
layout: default
title: Projects
---

<div class="container container-narrow">
  <div class="blog-header">
    <h1>Projects</h1>
  </div>

  <div class="card-list">
    {% for project in site.projects %}
      <a href="{% if project.external %}{{ project.external_url }}{% else %}{{ project.url }}{% endif %}"
         {% if project.external %}target="_blank"{% endif %} class="card">
        <span class="card-title">{{ project.title }}</span>
        <span class="card-desc">{{ project.desc }}</span>
      </a>
    {% endfor %}
  </div>
</div>
