title: Firmansyah Sundana
email: firmansyahsundana10@gmail.com
description: Sundana Personal Website
url: "https://sundana.github.io"
twitter_username: sundanaxyz
github_username: sundana

markdown: kramdown

plugins:
  - jekyll-feed
  - jekyll-seo-tag

collections:
  projects:
    output: true
    permalink: /projects/:name.html
  research:
    output: true
    permalink: /research/:name.html

defaults:
  - scope:
      path: ""
      type: "projects"
    values:
      layout: project
  - scope:
      path: ""
      type: "research"
    values:
      layout: research

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - package.json
  - package-lock.json
  - astro.config.mjs
  - tailwind.config.js
  - tsconfig.json
  - src/
  - dist/
  - .astro/
  - README.md
