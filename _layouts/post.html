---
layout: default
---
<article>
  <header>
    <h1>{{ page.title }}</h1>
    <p>
      <time datetime="{{ page.date | date: '%Y-%m-%d' }}">{{ page.date | date: "%B %d, %Y" }}</time>
      {% if page.author %} &middot; {{ page.author }}{% endif %}
    </p>
  </header>
  {{ content }}
  <hr />
  <p><a href="/blog">&larr; Back to Blog</a></p>
</article>
